name: Test, Build, and Publish Tagged Images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false

  publish:
    # Only creation of a remote Git tag can publish an image.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.created == true && github.event.deleted == false
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python for release automation
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate release tag and remove the v prefix
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_version.py prepare
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: |
            BUILD_VERSION=${{ steps.image.outputs.version }}
            BUILD_ARCH=amd64
      - name: Export Docker image for the release
        env:
          RELEASE_IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker pull "$RELEASE_IMAGE"
          docker save "$RELEASE_IMAGE" > docker-image.tar
      - name: Create GitHub Release and upload image
        uses: softprops/action-gh-release@v3
        with:
          files: docker-image.tar
          generate_release_notes: true
      - name: Update Home Assistant version on main without triggering CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_version.py update
