services:
  addon:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${port:-8000}:${port:-8000}"
      - "127.0.0.1:${debug_port:-8001}:${debug_port:-8001}"
    volumes:
      - telegram-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  telegram-data:
